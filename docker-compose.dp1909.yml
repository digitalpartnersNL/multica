#      /complete bereikt zonder substantive agent comment (type=comment,
#      body >= 30 trimmed chars, sinds started_at) wordt gere-route naar
#      het failure-path met failure_reason=missing_final_comment — zelfde
#      patroon als de GH #6402 context-exhaustion normalisatie.
#   2. Nieuwe platform-side failure reason missing_final_comment (23e
#      canonieke waarde; taskfailure-taxonomie + tests bijgewerkt).
#   3. Uitzonderingen (X5): COMMENT_PFLICHT_GATE=off killswitch
#      (fail-closed default), issue-metadata comment_plicht_exempt=true,
#      squad-leader no_action, chat/quick-create taken.
#   4. Tests: G3a (geen comment -> failed), G3b (triviaal "OK" telt
#      niet), positieve controle, X5-exemptie, chat-scope, killswitch.
#
# Blast radius (live DB, 14 d voor livegang): 17/3400 runs (0,5%) zou
# de gate triggeren; alle 17 leunden op de synthesized fallback-comment.
