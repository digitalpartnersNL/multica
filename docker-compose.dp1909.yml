# DP-1909 / HG-5 livegang override (12 sep 2026): backend op de lokaal
# herbouwde image met de comment-plicht gate.
#
# Probleem (HG-5 / DP-1909, plan.0071 Fase D1, testplan G3a/G3b):
# comment-plicht voor Multica-runs was uitsluitend prompt-geborgd
# (workdir CLAUDE.md "## Output" + runtime workflow). Een run die geen
# eindcomment post "slaagde" technisch gewoon — het resultaat bereikte
